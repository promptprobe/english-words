p","meaning":"실습 중심 교육","example":"Join the writing workshop."},{"id":"write-off","word":"write-off","meaning":"손실 처리","example":"Approve a debt write-off."},{"id":"year-end","word":"year-end","meaning":"연말","example":"Review sales at year-end."},{"id":"year-on-year","word":"year-on-year","meaning":"전년 대비","example":"Sales rose year-on-year."},{"id":"yield","word":"yield","meaning":"수익률","example":"The bond yield is 4%."},{"id":"zero-based-budget","word":"zero-based budget","meaning":"영기준 예산","example":"Build a zero-based budget."},{"id":"zero-sum","word":"zero-sum","meaning":"이득과 손실의 합이 0인","example":"This is a zero-sum game."},{"id":"zone","word":"zone","meaning":"구역","example":"Enter the loading zone."}]</script>
  <script>
  (() => {
    'use strict';
    const words = JSON.parse(document.getElementById('vocabulary').textContent);
    const wordsById = new Map(words.map(word => [word.id, word]));
    const knownIds = new Set(wordsById.keys());
    const storageKey = 'business-english-notes.checked.v1';
    const body = document.getElementById('words');
    const count = document.getElementById('count');
    const status = document.getElementById('announcement');
    const saveError = document.getElementById('save-error');
    let checked = new Set();
    const rows = new Map();
    const parse = value => {
      const ids = JSON.parse(value || '[]');
      return new Set(Array.isArray(ids) ? ids.filter(id => typeof id === 'string' && knownIds.has(id)) : []);
    };
    try { checked = parse(localStorage.getItem(storageKey)); }
    catch { saveError.hidden = false; saveError.textContent = '저장된 기록을 읽을 수 없습니다. 이번에 체크한 단어부터 표시합니다.'; }
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify([...checked])); saveError.hidden = true; }
      catch { saveError.hidden = false; saveError.textContent = '브라우저 저장을 사용할 수 없어, 페이지를 닫으면 체크가 사라질 수 있습니다.'; }
    }
    function render() {
      const ordered = [...words.filter(word => !checked.has(word.id)), ...[...checked].map(id => wordsById.get(id))];
      const firstDone = ordered.find(word => checked.has(word.id));
      const fragment = document.createDocumentFragment();
      ordered.forEach(word => {
        const row = rows.get(word.id);
        row.classList.toggle('is-done', checked.has(word.id));
        row.classList.toggle('first-done', word === firstDone);
        row.querySelector('input').checked = checked.has(word.id);
        fragment.append(row);
      });
      body.append(fragment);
      count.textContent = `${checked.size.toLocaleString()} / ${words.length.toLocaleString()}`;
      count.setAttribute('aria-label', `전체 ${words.length}개 중 ${checked.size}개 확인`);
      document.getElementById('footer').textContent = `${words.length.toLocaleString()} words · ${(words.length - checked.size).toLocaleString()} left`;
    }
    words.forEach(word => {
      const row = document.createElement('tr');
      row.dataset.id = word.id;
      const term = document.createElement('td'); term.className = 'word'; term.lang = 'en'; term.textContent = word.word;
      const meaning = document.createElement('td'); meaning.className = 'meaning'; meaning.textContent = word.meaning;
      const exampleCell = document.createElement('td'); exampleCell.className = 'example-cell';
      const example = document.createElement('span'); example.className = 'example'; example.lang = 'en'; example.textContent = word.example; example.tabIndex = 0; example.title = word.example;
      exampleCell.append(example);
      const checkCell = document.createElement('td'); checkCell.className = 'check-cell';
      const label = document.createElement('label'); label.className = 'check-target';
      const input = document.createElement('input'); input.type = 'checkbox'; input.setAttribute('aria-label', `${word.word} 확인`); input.dataset.id = word.id;
      label.append(input); checkCell.append(label); row.append(term, meaning, exampleCell, checkCell); rows.set(word.id, row);
    });
    body.addEventListener('change', event => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || input.type !== 'checkbox') return;
      const id = input.dataset.id;
      if (!knownIds.has(id)) return;
      const wasChecked = input.checked;
      const before = [...body.children];
      const rowIndex = before.indexOf(rows.get(id));
      const nearby = before.slice(rowIndex + 1).find(row => row.dataset.id !== id && !checked.has(row.dataset.id)) || before.slice(0, rowIndex).reverse().find(row => !checked.has(row.dataset.id));
      const position = window.scrollY;
      if (wasChecked) checked.add(id); else checked.delete(id);
      save(); render();
      const focusRow = wasChecked && nearby ? nearby : rows.get(id);
      focusRow.querySelector('input').focus({ preventScroll: true });
      window.scrollTo({ top: position, behavior: 'auto' });
      const word = wordsById.get(id);
      status.textContent = wasChecked ? `${word.word} 확인 완료. 맨 아래로 이동했습니다. ${checked.size}개 확인.` : `${word.word} 확인 해제. 원래 순서로 돌아왔습니다.`;
    });
    window.addEventListener('storage', event => {
      if (event.key !== storageKey && event.key !== null) return;
      try { checked = parse(event.newValue); render(); } catch { /* Keep the current list when another tab contains malformed data. */ }
    });
    render();
  })();
  </script>
